# Keep the terminal build independent from the full VS Code development install.
packages:
  - .
nodeLinker: hoisted
strictPeerDependencies: false
autoInstallPeers: false
strictDepBuilds: true
supportedArchitectures:
  os: [current, win32]
  cpu: [current]
allowBuilds:
  electron: true
  esbuild: true
  node-pty: true
  '@vscode/windows-process-tree': true
  '@vscode/windows-registry': true
